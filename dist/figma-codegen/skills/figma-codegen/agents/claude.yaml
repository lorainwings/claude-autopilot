interface:
  display_name: "Figma Codegen"
  short_description: "Translate Figma designs into production-ready code"
  icon_small: "../assets/figma-small.svg"
  icon_large: "../assets/figma.png"
  default_prompt: "Use figma-codegen to implement this Figma design in this codebase, matching layout, states, and responsive behavior."

dependencies:
  tools:
    - type: "mcp"
      value: "figma"
      description: "Figma MCP server (Remote / Desktop / local figma-developer-mcp)"
      transport: "streamable_http"
      url: "https://mcp.figma.com/mcp"
